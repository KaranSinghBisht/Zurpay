[package]
name = "zurpay-payroll"
version = "0.1.0"
description = "Zurpay - Confidential payroll on Solana with ZK eligibility proofs"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "zurpay_payroll"

[features]
default = ["devnet"]
devnet = []
testing = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
solana-program = "=1.18.26"
# Pin blake3 to avoid constant_time_eq 0.4.2 which requires edition2024
blake3 = "=1.5.5"
