[package]
name = "zurpay-payroll"
version = "0.1.0"
description = "Zurpay - Confidential payroll on Solana with ZK eligibility proofs"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "zurpay_payroll"

[features]
default = ["devnet"]
devnet = []
testing = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
anchor-spl = "0.30.1"
solana-program = "2.1"
inco-lightning = { version = "0.1.4", features = ["cpi"] }
# Pin to avoid edition2024 requirements
blake3 = "=1.5.5"
constant_time_eq = "=0.3.1"
