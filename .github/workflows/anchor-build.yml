name: Build Anchor Program

on:
  push:
    branches: [main, master]
    paths:
      - 'programs/**'
      - 'Anchor.toml'
      - '.github/workflows/anchor-build.yml'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  SOLANA_VERSION: 1.18.26
  ANCHOR_VERSION: 0.30.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Solana CLI
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/solana
            ~/.local/share/solana
          key: solana-${{ env.SOLANA_VERSION }}

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.solana.com/v${{ env.SOLANA_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI
        run: |
          npm install -g @coral-xyz/anchor-cli@${{ env.ANCHOR_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-

      - name: Generate Keypair
        run: solana-keygen new --no-bip39-passphrase -o ~/.config/solana/id.json

      - name: Build Program
        run: anchor build

      - name: Upload Program Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zurpay-payroll-program
          path: |
            target/deploy/*.so
            target/idl/*.json
            target/types/*.ts
          retention-days: 30
